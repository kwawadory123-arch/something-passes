<style>

#gauge i{display:block;height:100%;width:0;background:var(--ac);border-radius:5px}
#stick{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);touch-action:none}

<div id="feed"></div>
<div id="arw" class="hid"><svg id="arwS" viewBox="0 0 40 40"><path d="M20 3 L34 33 L20 26 L6 33 Z" fill="#ff5a4a" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg><div id="arwT"></div></div>
<div id="start"><h1>SOMETHING PASSES</h1><p>ロッカーのあいだを何かが通る</p><p>閉館後のプール施設。異音が鳴り始めたら、ロッカーへ隠れろ。外にいれば助からない。<br>ブレーカー → 電力復旧 → ポンプ4基 → 配線 → 箱を物置へ → 出口。<br><small>最大4人の協力プレイ。部屋を作ってコードを仲間に伝えよう。</small></p><input id="nm" maxlength="12" placeholder="なまえ" autocomplete="off"><input id="code" maxlength="6" placeholder="CODE" autocomplete="off"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="go" id="mkB">部屋を作る</button><button class="go" id="jnB">参加</button><button class="go" id="goB">ひとりで</button></div><div id="pg" class="hid"><i></i></div><p id="rs"></p></div>
<div id="lobby"><p style="margin:0">ルームコード</p><h1 id="lbCode"></h1><button class="go sm" id="lbCopy">コードをコピー</button><input id="lbNm" maxlength="12" placeholder="なまえ(編集できます)" autocomplete="off"><p style="margin:0">参加者 <span id="lbN"></span></p><div id="lbList"></div><button class="go" id="lbStart">ゲーム開始</button><p id="lbWait">ホストの開始を待っています…</p><button class="go sm" id="lbLeave" style="border-color:var(--dim);background:none">退出</button></div>
<div id="end"><h1 id="et" style="font-weight:300;margin:0"></h1><p id="ep"></p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="go" id="wB">観戦する</button><button class="go" id="reB">もう一度</button></div></div>

function tileTex(w,d){const t=new THREE.CanvasTexture(tc);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w/2,d/2);return t}

function gh(x,z){let h=0;if(x>4.5&&x<29.5&&z>7&&z<13){h=-4;if(z<9&&x<8.5)h=-.5*(Math.floor((x-4.5)/.5)+1);else if(z>11&&x>25.5)h=-.5*(Math.floor((29.5-x)/.5)+1)}if(x>13&&x<21&&z>16&&z<19.8)h=(x>15&&x<19&&z>17)?1:.5;if(x>13&&x<17||x>29&&x<33){if(z>-1.8&&z<-1)h=.14;else if(z>=-1&&z<0)h=.28;else if(z>=0&&z<.8)h=.14}return h}
{const c=new THREE.Mesh(new THREE.PlaneGeometry(34,40),mat(0x2a3438));c.material.side=THREE.DoubleSide;c.rotation.x=Math.PI/2;c.position.set(17,5,0);scene.add(c)}
// walls (grid)
const GX=-1,GZ=-41,NX=50,NZ=63,G=[];for(let i=0;i<NX;i++)G.push(new Array(NZ).fill(0));
function gr(x0,z0,x1,z1,id){for(let x=x0;x<x1;x++)for(let z=z0;z<z1;z++)G[x-GX][z-GZ]=id}
function gv(x,z){const a=x-GX,b=z-GZ;return a<0||b<0||a>=NX||b>=NZ?0:G[a][b]}

const CF=0xa38a66;

area(0,-12,12,-2,4,0xb8c8d6);area(3,-30,12,-18,3,0x6f685f);area(18,-11,28,-4,7,0x8a8878);area(34,-12,44,-2,5,0x88c4bb);area(34,-30,44,-16,6,0x55595c);
area(12,-9,13,-5,2,CF);area(12,-27,13,-23,2,CF);area(6,-13,10,-12,2,CF);area(6,-18,10,-17,2,CF);area(6,-32,10,-30,2,CF);area(21,-13,25,-11,2,CF);area(28,-9,29,-6,2,CF);area(33,-9,34,-5,2,CF);area(33,-26,34,-22,2,CF);area(37,-32,41,-30,2,CF);
const WCOL={2:0xcdbd98,3:0x7d6f5e,4:0x8fb3c9,5:0x6fb3a8,6:0x586a4c,7:0x8a8668},WM={};

const pipeM=mat(0xb08a2a),pipe2=mat(0x6b7b86),tkM=mat(0x7d8a90);

cur=null;let bd=2.3;for(const o of IT){if(o.fin||dead||fled)continue;const d=Math.hypot(o.x-px,o.z-pz);if(d<bd){bd=d;cur=o}}
nearLk=null;bd=2.3;if(!hidden&&!dead&&!fled)for(const l of LK){const d=Math.hypot(l.x-px,l.z-pz);if(d<bd){bd=d;nearLk=l}}
$('opB').classList.toggle('hid',!cur||!!hidden||wOpen);$('lkB').classList.toggle('hid',!hidden&&!nearLk);$('lkB').textContent=hidden?'出る':'隠れる';
if(cur)$('opB').textContent=cur.type==='tap'?'調べる':'長押し';
const g=$('gauge');if(holding&&cur&&cur.type!=='tap'&&(!cur.req||cur.req())&&!hidden){cur.prog+=dt/cur.time;g.style.display='block';g.firstChild.style.width=Math.min(100,cur.prog*100)+'%';if(cur.prog>=1){cur.fin=true;cur.lamp.material.color.setHex(0x44ff88);holding=false;tone(400,900,.4,'sine',.2);cur.done();hud()}}
else if(cur&&cur.prog>0&&!cur.fin&&cur.type!=='tap'){g.style.display='block';g.firstChild.style.width=cur.prog*100+'%';g.style.opacity=.45}else g.style.display='none';
if(holding)g.style.opacity=1;
for(const o of IT)if(o.spin&&o.fin)o.spin.rotation.y+=dt*6;
if(failT>0){failT-=dt;if(failT<=0)startWarn(5)}
passUpdate(dt);if(over)return;
if(S.wire&&!S.box&&Math.hypot((boxC.x0+boxC.x1)/2-6,(boxC.z0+boxC.z1)/2+24)<.8){doBox()}
if(px>47&&!dead&&!fled)win();
// camera
let sh=0;if(ps.st==='dark')sh=hidden?.18:0;else if(ps.st==='warn')sh=Math.pow(ps.t/ps.len,2)*.24;
camera.position.set(px,py,pz);camera.rotation.set(pitch+(Math.random()-.5)*sh,yaw+(Math.random()-.5)*sh,0);
monUpdate(dt);mpUpdate(dt);
// atmosphere
if(ps.st!=='dark'){if(Math.random()<.02)pl.intensity=.3+Math.random()*.5;else pl.intensity+=(1-pl.intensity)*.1;if(Math.random()<.03){const m=PAN[(Math.random()*PAN.length)|0];m.color.setHex(Math.random()<.5?0x222a30:0xdff0ff)}}
$('warnTxt').style.display=ps.st==='warn'?'block':'none';if(++nf%2===0)noiseDraw();nc.style.opacity=(ps.st==='warn'?.025+ps.t/ps.len*.1:ps.st==='dark'?.18:.025)}
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;if(started&&!over)update(dt);renderer.render(scene,camera)}
function begin(idx){$('start').style.display='none';$('lobby').style.display='none';lobbyOpen=false;initAudio();started=true;
if(mp){seedPerm(code);const k=idx||0;px=15.5+k*1.3;pz=4+(k%2)*.7;clearInterval(netT);netT=setInterval(netTick,120)}
hud();toast('まずブレーカーを探せ(シャワー室)',3500)}
async function doCreate(){readNm();initAudio();pgSet(12,'部屋を作成中…');let r='used';for(let i=0;i<6&&r==='used';i++){let c='';for(let k=0;k<4;k++)c+='ABCDEFGHJKMNPQRSTUVWXYZ23456789'[(Math.random()*31)|0];r=await openRoom(c,true)}pgEnd();$('rs').textContent=r==='used'?'コードが重複しました。もう一度試してください':r}
async function doJoin(){const c=$('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(c.length<3){$('rs').textContent='コードを入力してください';return}readNm();initAudio();pgSet(12,'接続中…');const r=await openRoom(c,false);pgEnd();$('rs').textContent=r}
$('nm').value=myName;
$('mkB').onclick=doCreate;$('jnB').onclick=doJoin;$('goB').onclick=()=>{readNm();begin(0)};
$('lbNm').oninput=()=>{myName=$('lbNm').value.trim().slice(0,12);saveName();clearTimeout(nmT);nmT=setTimeout(()=>{track();hud()},350)};
$('lbCopy').onclick=()=>{try{navigator.clipboard.writeText(code);$('lbCopy').textContent='コピーしました'}catch(e){}};
$('lbLeave').onclick=()=>{leaveRoom();$('lobby').style.display='none';$('start').style.display='flex';$('rs').textContent=''};
$('lbStart').onclick=()=>{if(hostId!==myid||gameOn)return;const pl=orderList().slice(0,4).map(r=>({id:r.id,name:r.name}));const msg={t:'start',pl};mpEmit(msg);beginMp(msg);[500,1200,2500].forEach(t=>setTimeout(()=>mpEmit(msg),t))};
$('wB').onclick=()=>{$('end').style.display='none'};
// 修正: pagehide での removeChannel は削除(アプリ切替でホストの部屋が消えるのを防ぐ)
hold($('rvB'),()=>rvHold=true,()=>rvHold=false);
$('reB').onclick=()=>location.reload();
// 修正: 復帰時と定期的に名簿へ再登録
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&CH&&sb){
    try{sb.realtime.connect()}catch(e){}
    setTimeout(track,300);setTimeout(track,1500);
  }
});
setInterval(()=>{if(CH&&(!roster[myid]||hostId===myid))track()},10000);
camera.position.set(px,py,pz);camera.rotation.set(0,yaw,0);requestAnimationFrame(loop);
</script></body></html>
